  <g transform="translate(542 72)" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -10l-10 10 10 10M8 -10l10 10-10 10M4 -14l-8 28"/></g>
