  <circle cx="778" cy="72" r="30" fill="#1E5BFF" fill-opacity=".18"/>
  <g transform="translate(778 72)" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-12" width="24" height="24" rx="5"/><path d="M-6 -18v6M6 -18v6M-6 12v6M6 12v6M-18 -6h6M-18 6h6M12 -6h6M12 6h6"/><circle r="4"/></g>
