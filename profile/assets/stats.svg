<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B24"/><stop offset="1" stop-color="#0B1E5B"/></linearGradient>
<radialGradient id="orbA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1E5BFF" stop-opacity=".75"/><stop offset="1" stop-color="#1E5BFF" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38BDF8" stop-opacity=".45"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#1E5BFF"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<style>.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}.in{animation:in .8s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style></defs>

<g class="in" style="animation-delay:0.00s">
  <rect x="20" y="20" width="275" height="150" rx="18" fill="#0B1638" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="t" x="44" y="92" font-size="52" font-weight="800" fill="url(#accent)">+50</text>
  <text class="t" x="44" y="126" font-size="16" fill="#A9B8E0">Successful digital products</text>
  <rect x="44" y="146" width="227" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" from="0" to="227" begin="0.30s" dur="1.2s"/></rect>
</g>
<g class="in" style="animation-delay:0.15s">
  <rect x="315" y="20" width="275" height="150" rx="18" fill="#0B1638" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="t" x="339" y="92" font-size="52" font-weight="800" fill="url(#accent)">8+</text>
  <text class="t" x="339" y="126" font-size="16" fill="#A9B8E0">Years of combined experience</text>
  <rect x="339" y="146" width="227" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" from="0" to="227" begin="0.45s" dur="1.2s"/></rect>
</g>
<g class="in" style="animation-delay:0.30s">
  <rect x="610" y="20" width="275" height="150" rx="18" fill="#0B1638" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="t" x="634" y="92" font-size="52" font-weight="800" fill="url(#accent)">15+</text>
  <text class="t" x="634" y="126" font-size="16" fill="#A9B8E0">Industries served</text>
  <rect x="634" y="146" width="227" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" from="0" to="227" begin="0.60s" dur="1.2s"/></rect>
</g>
<g class="in" style="animation-delay:0.45s">
  <rect x="905" y="20" width="275" height="150" rx="18" fill="#0B1638" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="t" x="929" y="92" font-size="52" font-weight="800" fill="url(#accent)">24/7</text>
  <text class="t" x="929" y="126" font-size="16" fill="#A9B8E0">Partnership, launch to scale</text>
  <rect x="929" y="146" width="227" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" from="0" to="227" begin="0.75s" dur="1.2s"/></rect>
</g>
</svg>
